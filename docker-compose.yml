services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabora
      POSTGRES_PASSWORD: sabora
      POSTGRES_DB: sabora
    ports:
      # 5434, no 5432: esta máquina ya tiene un Postgres nativo/otro contenedor en 5432/5433.
      - "5434:5432"
    volumes:
      - sabora_pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      # 8081, no 8080: esta máquina ya tiene otro Adminer en 8080.
      - "8081:8080"

volumes:
  sabora_pg_data:
